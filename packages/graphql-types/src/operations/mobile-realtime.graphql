    id
    kind
    occurredAt
    workspaceId
    projectId
    taskId
  }
}

subscription MobileWorkspaceMembershipChanged($workspaceId: ID!) {
  workspaceMembershipChanged(workspaceId: $workspaceId) {
    id
    kind
    occurredAt
    workspaceId
    projectId
    taskId
  }
}
