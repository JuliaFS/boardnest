name: boardnest

services:
  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    image: boardnest-api:local
    build:
      context: .
      target: api-runtime
    environment:
      API_URL: ${DOCKER_API_URL:-http://localhost:4000}
      COOKIE_SAME_SITE: ${DOCKER_COOKIE_SAME_SITE:-lax}
      CORS_ORIGIN: ${DOCKER_WEB_ORIGIN:-http://localhost:8080}
      NODE_ENV: ${DOCKER_NODE_ENV:-development}
      PORT: 4000
      REDIS_URL: redis://redis:6379
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: boardnest-web:local
    build:
      context: .
      target: web-runtime
      args:
        VITE_API_URL: ${DOCKER_PUBLIC_API_URL:-http://localhost:4000}
        VITE_GRAPHQL_URL: ${DOCKER_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
        VITE_WS_URL: ${DOCKER_PUBLIC_WS_URL:-ws://localhost:4000/graphql}
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
