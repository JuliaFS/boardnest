name: boardnest

services:
  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    image: boardnest-api:local
    build:
      context: .
      target: api-runtime
    environment:
      API_URL: ${DOCKER_API_URL:-http://localhost:4000}
      COOKIE_SAME_SITE: ${DOCKER_COOKIE_SAME_SITE:-lax}
      CORS_ORIGIN: ${DOCKER_WEB_ORIGIN:-http://localhost:8080}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      GUEST_RATE_LIMIT_SECRET: ${GUEST_RATE_LIMIT_SECRET:?Set GUEST_RATE_LIMIT_SECRET in .env}
      INVITATION_EMAIL_FROM: ${INVITATION_EMAIL_FROM:-}
      NODE_ENV: ${DOCKER_NODE_ENV:-development}
      PORT: 4000
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      REMINDER_SCHEDULER_BATCH_SIZE: ${REMINDER_SCHEDULER_BATCH_SIZE:-100}
      REMINDER_SCHEDULER_ENABLED: ${REMINDER_SCHEDULER_ENABLED:-false}
      REMINDER_SCHEDULER_INTERVAL_MS: ${REMINDER_SCHEDULER_INTERVAL_MS:-30000}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: boardnest-web:local
    build:
      context: .
      target: web-runtime
      args:
        VITE_API_URL: ${DOCKER_PUBLIC_API_URL:-http://localhost:4000}
        VITE_GRAPHQL_URL: ${DOCKER_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
        VITE_WS_URL: ${DOCKER_PUBLIC_WS_URL:-ws://localhost:4000/graphql}
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
